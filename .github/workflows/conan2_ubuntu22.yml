name: conan2 build sudo

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    - name: install conan2
      run: |
        sudo apt update
        sudo apt install -y python3-pip libgl-dev libgl1-mesa-dev libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxfixes-dev libxi-dev libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxres-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev libxcb-util-dev libx11-xcb-dev libfontenc-dev libice-dev libsm-dev libxau-dev
        sudo pip3 install conan==2.0.6
        sudo conan profile detect
        sudo sed -i 's/gnu14/gnu17/g' /root/.conan2/profiles/default
        sudo bash -c 'echo "" >>  /root/.conan2/profiles/default'
        sudo bash -c 'echo "[conf]" >>  /root/.conan2/profiles/default'
        sudo bash -c 'echo "tools.system.package_manager:mode=install" >>  /root/.conan2/profiles/default'
        sudo cat /root/.conan2/profiles/default

    - name: conan build
      run: |
        cd conan2opencvtest
        rm -rf build
        mkdir build
        cd build
        sudo conan install -u ../ --build=missing
        cmake .. -DCMAKE_PREFIX_PATH=../ -DCMAKE_TOOLCHAIN_FILE=conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
        cmake --build .

name: conan2 build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    - name: install conan2
      run: |
        sudo apt update
        sudo apt install -y python3-pip libgl-dev libgl1-mesa-dev libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxfixes-dev libxi-dev libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxres-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev libxcb-util-dev libx11-xcb-dev libfontenc-dev libice-dev libsm-dev libxau-dev
        sudo pip3 install conan==2.0.6
        conan --version
        conan profile detect --force
        sed -i 's/gnu14/gnu17/g' ~/.conan2/profiles/default
        echo "" >> ~/.conan2/profiles/default
        echo "[conf]" >> ~/.conan2/profiles/default
        echo "tools.system.package_manager:mode=install" >> ~/.conan2/profiles/default
        cat ~/.conan2/profiles/default

    - name: conan build
      run: |
        wget --no-check-certificate https://github.com/Kitware/CMake/releases/download/v3.27.9/cmake-3.27.9-linux-x86_64.tar.gz
        tar -xvf cmake-3.27.9-linux-x86_64.tar.gz > /dev/null
        mv cmake-3.27.9-linux-x86_64 cmake-install
        pwd_path=$(pwd)
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH
        cmake --version
        cd conan2asiotest
        rm -rf build
        conan install -u ./ --build=missing
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH cmake --preset conan-release
        cd build/Release/
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH cmake --build .
        cd ../../../
        cd conan2pocotest
        rm -rf build
        conan install -u ./ --build=missing
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH cmake --preset conan-release
        cd build/Release/
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH cmake --build .
        cd ../../../
        cd conan2zlibtest
        rm -rf build
        conan install -u ./ --build=missing
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH cmake --preset conan-release
        cd build/Release/
        PATH=${pwd_path}/cmake-install:${pwd_path}/cmake-install/bin:$PATH cmake --build .
